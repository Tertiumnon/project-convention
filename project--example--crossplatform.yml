# Example project.yml for one desktop app built for Windows, macOS and Linux from the same code.
# Placeholder names; see project--example.yml for every field.
type: desktop-app
display_name: Pumpkin Timer
identifier: com.johndoe.pumpkintimer
summary: A countdown timer for carving pumpkins, for Windows, macOS and Linux.
categories:
  - utilities
status: beta
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
privacy_policy: https://johndoe.example/pumpkin-timer/privacy
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  windows:
    min_version: "10.0.19041"
    screenshots:
      desktop:
        - docs/screenshots/windows/01-timer.png
    distribution:
      - microsoft-store
    settings:
      installer: msix
  macos:
    min_version: "13.0"
    screenshots:
      desktop:
        - docs/screenshots/macos/01-timer.png
    distribution:
      - mac-app-store
    settings:
      notarized: true
  linux:
    screenshots:
      desktop:
        - docs/screenshots/linux/01-timer.png
    distribution:
      - flathub
    settings:
      package_formats:
        - AppImage
        - flatpak
icon: assets/logo/logo.png
data_collected: none
