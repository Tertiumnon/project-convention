# Example project.yml for one desktop app built for Windows, macOS and Linux from the same code.
# Placeholder names; see project--example.yml for every field.
type: desktop-app
slug: pumpkin-timer
identifier: com.johndoe.pumpkintimer
status: beta
categories:
  - utilities
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, for Windows, macOS and Linux.
description:
  en: |
    Pumpkin Timer counts down while you carve. Set as many timers as you like
    and get a notification when each one ends.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
privacy_policy: https://johndoe.example/pumpkin-timer/privacy
icon: assets/logo/logo.png
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  windows:
    min_version: "10.0.19041"
    screenshots:
      desktop:
        - docs/screenshots/windows/01-timer.png
    distribution:
      - microsoft-store
    settings:
      installer: msix
  macos:
    min_version: "13.0"
    screenshots:
      desktop:
        - docs/screenshots/macos/01-timer.png
    distribution:
      - mac-app-store
    settings:
      notarized: true
  linux:
    screenshots:
      desktop:
        - docs/screenshots/linux/01-timer.png
    distribution:
      - flathub
    settings:
      package_formats:
        - AppImage
        - flatpak
