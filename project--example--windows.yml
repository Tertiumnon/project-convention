# Example project.yml for a Windows desktop app. Placeholder names.
type: desktop-app
identifier: com.johndoe.pumpkintimer
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, for Windows.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
privacy_policy: https://johndoe.example/pumpkin-timer/privacy
icon: assets/logo/logo.png
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  windows:
    min_version: "10.0.19041"
    screenshots:
      desktop:
        - docs/screenshots/windows/01-timer.png
    distribution:
      - microsoft-store
    settings:
      installer: msix
