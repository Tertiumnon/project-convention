# Example project.yml for a macOS desktop app. Placeholder names; see project--example.yml for every field.
type: desktop-app
slug: pumpkin-timer
identifier: com.johndoe.pumpkintimer
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, for macOS.
description:
  en: |
    Pumpkin Timer counts down while you carve. Set as many timers as you like
    and get a notification when each one ends.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
privacy_policy: https://johndoe.example/pumpkin-timer/privacy
icon: assets/logo/logo.png
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  macos:
    min_version: "13.0"
    screenshots:
      desktop:
        - docs/screenshots/macos/01-timer.png
    distribution:
      - mac-app-store
    settings:
      notarized: true
