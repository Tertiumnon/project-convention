# Example project.yml for an iOS app. Placeholder names; see project--example.yml for every field.
type: mobile-app
identifier: com.johndoe.pumpkintimer
status: beta
categories:
  - utilities
display_name:
  en: Pumpkin Timer
summary:
  en: Countdown timer for carving and trick-or-treat night.
description:
  en: |
    Pumpkin Timer counts down to the moments that matter on Halloween. Set as many timers
    as you like and get a gentle vibration when each one ends.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
privacy_policy: https://johndoe.example/pumpkin-timer/privacy
icon: assets/logo/logo.png
data_collected: none
age_rating: everyone
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  ios:
    min_version: "16.0"
    permissions:
      - name: NSPhotoLibraryAddUsageDescription
        reason: Saves a picture of your carved pumpkin to Photos.
    screenshots:
      iphone_6_9:
        - docs/screenshots/ios/01-timer.png
        - docs/screenshots/ios/02-settings.png
      ipad_13:
        - docs/screenshots/ios/ipad-13-timer.png
    distribution:
      - app-store
    settings:
      sku: pumpkintimer-ios
      primary_category: Utilities
      secondary_category: Lifestyle
      copyright: "© 2026 John Doe"
store:
  subtitle:
    en: Halloween countdown timer
  keywords:
    en: halloween,pumpkin,timer,countdown,carving
  promotional_text:
    en: Count down to carving time and the first trick-or-treat knock.
  release_notes:
    en: First release.
compliance:
  pricing: free
  export_compliance:
    uses_encryption: false
  content_rating:
    violence: none
    user_generated_content: no
  target_audience:
    - all ages
