# Example project.yml for an Android app. Placeholder names; see project--example.yml for every field.
type: mobile-app
slug: pumpkin-timer
identifier: com.johndoe.pumpkintimer
status: beta
categories:
  - utilities
display_name:
  en: Pumpkin Timer
summary:
  en: Countdown timer for carving and trick-or-treat night.
description:
  en: |
    Pumpkin Timer counts down to the moments that matter on Halloween. Set as many timers
    as you like and get a gentle vibration when each one ends.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
privacy_policy: https://johndoe.example/pumpkin-timer/privacy
icon: assets/logo/logo.png
data_collected: none
age_rating: everyone
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  android:
    min_version: 26
    permissions:
      - name: android.permission.VIBRATE
        reason:
          en: Vibrates when the timer ends.
    screenshots:
      phone:
        - docs/screenshots/android/01-timer.png
        - docs/screenshots/android/02-settings.png
    distribution:
      - google-play
    settings:
      target_version: 35
      feature_graphic: assets/store/android/feature-graphic.png
store:
  release_notes:
    en: First release.
compliance:
  pricing: free
  content_rating:
    violence: none
    user_generated_content: false
  target_audience:
    - all ages
  data_safety:
    collects: none
    shares: none
    deletion_request_url: https://johndoe.example/pumpkin-timer/privacy#delete
