# Example project.yml for a Firefox extension. Placeholder names.
type: firefox-extension
identifier: com.johndoe.pumpkintimer
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, as a Firefox extension.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
icon: assets/icons/icon-128.png
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  firefox:
    distribution:
      - firefox-addons
    settings:
      manifest_version: 3
