# Example project.yml for a Firefox extension. Placeholder names; see project--example.yml for every field.
type: firefox-extension
slug: pumpkin-timer
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, as a Firefox extension.
description:
  en: |
    Pumpkin Timer sits in the toolbar and counts down while you carve.
    Start a timer with one click and get a notification when it ends.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
icon: assets/logo/logo.png
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  firefox:
    identifier: pumpkin-timer@johndoe.example
    screenshots:
      desktop:
        - docs/screenshots/firefox/01-timer.png
    distribution:
      - firefox-addons
    settings:
      manifest_version: 3
