# Example project.yml for a Chromium browser extension. Placeholder names; see project--example.yml for every field.
type: browser-extension
display_name: Pumpkin Timer
identifier: com.johndoe.pumpkintimer
summary: A countdown timer for carving pumpkins, as a browser extension.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  chromium:
    distribution:
      - chrome-web-store
    settings:
      manifest_version: 3
icon: assets/icons/icon-128.png
data_collected: none
