# Example project.yml: a complete manifest for a web app.
# Fields that package.json already holds (version, license, repository, engines) are not repeated here.
# Copy it to the root of a project, delete the fields that do not apply, and adapt the values.

# ── Identity ──────────────────────────────────────────────────────────────
type: web-app
display_name: Hallowentine
short_name: Hallowentine
summary: Create and share personalized Halloween greeting cards.
keywords:
  - halloween
  - greeting cards
  - cards
  - invitations
categories:
  - entertainment
  - social
status: stable

# ── Languages ─────────────────────────────────────────────────────────────
languages:
  - en
  - es
  - pt-BR
  - ru
  - fr
  - de
  - it
default_language: en
code_languages:
  - TypeScript

# ── Links ─────────────────────────────────────────────────────────────────
url: https://halloweentine.tiii.dev
support: https://github.com/Tertiumnon/halloweentine-www/issues

# ── People ────────────────────────────────────────────────────────────────
author:
  name: Tertium

# ── Platforms and runtime ─────────────────────────────────────────────────
platforms:
  - web
runtime:
  - node >=24
  - bun
frameworks:
  - SolidJS

# ── Media ─────────────────────────────────────────────────────────────────
icon: assets/logo/logo.png
social_card: public/social-card.png

# ── Distribution ──────────────────────────────────────────────────────────
distribution:
  - web
environments:
  - dev
  - prod

# ── Privacy and content ───────────────────────────────────────────────────
data_collected: none
age_rating: everyone
