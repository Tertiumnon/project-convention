# Example project.yml for a web app: the attributes that package.json does not hold.
# Copy it to the root of a project and adapt the values.

# Required. One of the types listed in README (Project attributes).
type: web-app

# Required. The name people see: README title, site title, app name.
display_name: Hallowentine

# Required. One sentence, up to 120 characters. Same text as the GitHub description.
summary: Create and share personalized Halloween greeting cards.

# Public address of the site. Omit when the project has none.
url: https://halloweentine.tiii.dev

# Required for web apps. BCP 47 tags of every language the interface supports.
languages:
  - en
  - es
  - pt-BR
  - ru
  - fr
  - de
  - it

# Required when languages is set. Used when the visitor's language is not in the list.
default_language: en

# Frameworks the project is built with, by name.
frameworks:
  - SolidJS
