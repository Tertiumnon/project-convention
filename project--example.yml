# Complete project.yml: every field the convention defines, with placeholder values.
# A mobile app with a web version. Real projects keep only the fields that apply to them.
# package.json holds version, license, repository and engines, so they are not repeated here.
# Names are placeholders.
# Platform examples: project--example--<platform>.yml

# ── App ───────────────────────────────────────────────────────────────────
# Everything that describes the app. Text fields are language maps: one key per language.
type: mobile-app
slug: hallowentine
identifier: com.johndoe.hallowentine   # installed platforms only; reverse-DNS
short_name: Hallowentine
status: stable
keywords:
  - halloween
  - greeting cards
categories:                            # first is the primary store category
  - entertainment
  - social
display_name:
  en: Hallowentine
  fr: Hallowentine
summary:                               # up to 120 characters; the GitHub description
  en: Create and share personalized Halloween greeting cards.
  fr: Créez et partagez des cartes d'Halloween personnalisées.
description:                           # long text; store descriptions come from here
  en: |
    Hallowentine turns a short message into a Halloween card you can share as a link.
    Choose a mood, write a message, and send it to a friend.
  fr: |
    Hallowentine transforme un court message en carte d'Halloween à partager par lien.
    Choisissez une ambiance, écrivez un message et envoyez-le à un ami.
# language: TypeScript               # only when GitHub's detected language is wrong

languages:
  - en
  - fr
default_language: en
rtl_languages: []
code_languages:
  - TypeScript

url: https://hallowentine.johndoe.example
documentation: https://github.com/johndoe/hallowentine#readme
support: https://github.com/johndoe/hallowentine/issues
funding: https://johndoe.example/support
privacy_policy: https://johndoe.example/privacy
terms_of_service: https://johndoe.example/terms

frameworks:
  - SolidJS

icon: assets/logo/logo.png
theme_color: "#17120f"
background_color: "#17120f"
copyright: "© 2026 John Doe"
deep_links:
  scheme: hallowentine
  hosts:
    - hallowentine.johndoe.example
  paths:
    - /card
social_card: public/social-card.png
screenshots:
  - docs/screenshots/01-home.png
  - docs/screenshots/02-card.png
video: https://johndoe.example/hallowentine-demo

data_collected: none
age_rating: everyone
accessibility: WCAG 2.2 AA             # only when tested

# Doc projects only (guide, cookbook, style-guide, conventions, agreement):
# audience: [developers]
# entry_point: content/README.md
# formats: [markdown, html, pdf]

# ── People ────────────────────────────────────────────────────────────────
# Placeholder names. Real people replace them. No email addresses.
team:
  - name: John Doe
    roles:
      - owner
      - developer
    github: johndoe
  - name: Jane Doe
    roles:
      - designer
      - translator
    github: janedoe
    languages:
      - fr
  - name: Sam Doe
    roles:
      - maintainer
      - contributor
    github: samdoe
  - name: Alex Doe
    roles:
      - reviewer
    url: https://johndoe.example/alex

# ── Platforms ─────────────────────────────────────────────────────────────
# Every platform uses the same keys: min_version, identifier, permissions, screenshots,
# distribution, settings. Other platform ids: windows, macos, linux, chromium, firefox,
# vscode, telegram. Each has its own example file.
platforms:
  android:
    min_version: 26
    permissions:
      - name: android.permission.INTERNET
        reason:
          en: Loads the card a sender shared.
    screenshots:
      phone:
        - docs/screenshots/android/01-home.png
        - docs/screenshots/android/02-card.png
      tablet_7:
        - docs/screenshots/android/tablet-7-home.png
      tablet_10:
        - docs/screenshots/android/tablet-10-home.png
    distribution:
      - google-play
    settings:
      target_version: 35
      feature_graphic: assets/store/android/feature-graphic.png
  ios:
    min_version: "16.0"
    permissions: []
    screenshots:
      iphone_6_9:
        - docs/screenshots/ios/01-home.png
        - docs/screenshots/ios/02-card.png
      ipad_13:
        - docs/screenshots/ios/ipad-13-home.png
    distribution:
      - app-store
    settings:
      sku: hallowentine-ios
  web:

distribution:                          # channels not tied to one platform; stores sit under platforms
  - web
listed_on:                             # catalogues that list this project
  - https://johndoe.example
environments:
  - dev
  - prod

# ── Store overrides ───────────────────────────────────────────────────────
# Title, description and short description come from app. Give a value here only when a
# store needs different text. Keys are store fields; values are language maps.
store:
  subtitle:
    en: Halloween greeting cards
    fr: Cartes d'Halloween
  keywords:
    en: halloween,greeting,card,invitation
    fr: halloween,carte,invitation,fête
  promotional_text:
    en: Make someone's Halloween a little more personal.
    fr: Rendez l'Halloween de quelqu'un un peu plus personnel.
  release_notes:
    en: First release.
    fr: Première version.

# ── Compliance ────────────────────────────────────────────────────────────
compliance:
  pricing: free
  export_compliance:
    uses_encryption: false
  content_rating:
    violence: none
    user_generated_content: false
  target_audience:
    - all ages
  data_safety:
    collects: none
    shares: none
    deletion_request_url: https://johndoe.example/privacy#delete
