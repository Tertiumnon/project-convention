# Example project.yml for a web app. Placeholder names; see project--example.yml for every field.
type: web-app
identifier: com.johndoe.pumpkintimer
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, in the browser.
languages:
  - en
default_language: en
url: https://pumpkin-timer.johndoe.example
icon: assets/logo/logo.png
theme_color: "#17120f"
background_color: "#17120f"
social_card: public/social-card.png
engines:
  - node >=24
  - bun
frameworks:
  - SolidJS
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  web:
    settings:
      start_url: /
      display: standalone
distribution:
  - web
environments:
  - prod
