# Example project.yml for a Linux desktop app. Placeholder names; see project--example.yml for every field.
type: desktop-app
identifier: com.johndoe.pumpkintimer
display_name:
  en: Pumpkin Timer
summary:
  en: A countdown timer for carving pumpkins, for Linux.
languages:
  - en
default_language: en
url: https://johndoe.example/pumpkin-timer
icon: assets/logo/logo.png
data_collected: none
team:
  - name: John Doe
    roles:
      - owner
      - developer
platforms:
  linux:
    screenshots:
      desktop:
        - docs/screenshots/linux/01-timer.png
    distribution:
      - flathub
    settings:
      package_formats:
        - AppImage
        - flatpak
